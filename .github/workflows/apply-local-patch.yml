name: Apply local implementation patch

on:
  push:
    branches:
      - codex/focused-ai-utility-redesign
    paths:
      - .github/workflows/apply-local-patch.yml

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/focused-ai-utility-redesign
          fetch-depth: 0

      - name: Reassemble and apply patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import lzma
          import os
          import re
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/1/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          chunks: dict[int, str] = {}
          pattern = re.compile(r"<!-- PATCH-CHUNK-(\d{2}) -->\s*\n([A-Za-z0-9+/=]+)")
          for comment in comments:
              match = pattern.search(comment.get("body", ""))
              if match:
                  chunks[int(match.group(1))] = match.group(2).strip()

          expected = list(range(9))
          missing = [number for number in expected if number not in chunks]
          if missing:
              raise SystemExit(f"Missing patch chunks: {missing}")

          encoded = "".join(chunks[number] for number in expected)
          patch = lzma.decompress(base64.b64decode(encoded))
          with open("/tmp/focused-ai-utility.patch", "wb") as output:
              output.write(patch)
          print(f"Reassembled {len(patch)} patch bytes from {len(expected)} chunks")
          PY
          git apply --check /tmp/focused-ai-utility.patch
          git apply /tmp/focused-ai-utility.patch

      - name: Commit implementation
        run: |
          rm .github/workflows/apply-local-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver focused neutral basket utility"
          git push origin HEAD:codex/focused-ai-utility-redesign
