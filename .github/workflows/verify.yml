name: Verify

on:
  push:
    branches:
      - main
      - codex/focused-ai-utility-redesign
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Export pnpm package
        run: |
          mkdir -p tooling
          npm pack pnpm@9.15.9 --pack-destination tooling

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            .
            !node_modules
            !.git
            !tooling
          include-hidden-files: true
          retention-days: 1

      - name: Upload local tooling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-tooling
          path: tooling
          retention-days: 1
